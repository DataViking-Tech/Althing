name: Global Survey Respondents
version: "1"
description: >
  Population pack: one minimal survey-respondent persona per country,
  keyed by the `country` attribute. Built for population conditioning
  (althing.population): a caller passes the countries a question was asked
  in and samples are split across the matching personas. Covers every
  country in GlobalOpinionQA (Pew Global Attitudes and World Values
  Survey), using plain country names. Personas carry no other
  demographics, so a run measures country conditioning alone.

